<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="40%" stop-color="#DC2626" />
      <stop offset="80%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>

    <!-- Bolt Gold Glow Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Circuit Gold Stroke -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.5" />
    </linearGradient>

    <!-- Outer Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Tile with Smooth Rounded Corners -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="8" />

  <!-- Inner Subtle Border -->
  <rect x="32" y="32" width="448" height="448" rx="92" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Circuit Traces Left -->
  <g stroke="url(#circuitGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 60 160 L 130 160 L 160 190 L 160 260" />
    <circle cx="60" cy="160" r="7" fill="#FDE047" stroke="none" />
    
    <path d="M 60 256 L 110 256 L 140 286 L 140 360 L 110 390 L 60 390" />
    <circle cx="60" cy="256" r="7" fill="#FDE047" stroke="none" />
    <circle cx="60" cy="390" r="7" fill="#FDE047" stroke="none" />

    <path d="M 100 90 L 100 130 L 120 150" />
    <circle cx="100" cy="90" r="6" fill="#FDE047" stroke="none" />
  </g>

  <!-- Circuit Traces Right -->
  <g stroke="url(#circuitGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 452 160 L 382 160 L 352 190 L 352 260" />
    <circle cx="452" cy="160" r="7" fill="#FDE047" stroke="none" />
    
    <path d="M 452 256 L 402 256 L 372 286 L 372 360 L 402 390 L 452 390" />
    <circle cx="452" cy="256" r="7" fill="#FDE047" stroke="none" />
    <circle cx="452" cy="390" r="7" fill="#FDE047" stroke="none" />

    <path d="M 412 90 L 412 130 L 392 150" />
    <circle cx="412" cy="90" r="6" fill="#FDE047" stroke="none" />

    <path d="M 320 440 L 350 410 L 420 410" />
    <circle cx="420" cy="410" r="6" fill="#FDE047" stroke="none" />
  </g>

  <!-- Neon Radiant Aura behind Lightning Bolt -->
  <path
    d="M 285 70 L 170 260 L 255 260 L 210 442 L 352 225 L 268 225 Z"
    fill="#F59E0B"
    opacity="0.35"
    filter="url(#boltGlow)"
  />

  <!-- Main Ultra-Sharp Electric Lightning Bolt -->
  <path
    d="M 285 70 L 170 260 L 255 260 L 210 442 L 352 225 L 268 225 Z"
    fill="url(#boltGrad)"
    stroke="#FFFFFF"
    stroke-width="6"
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#boltGlow)"
  />

  <!-- Core Bright Specular Highlight -->
  <path
    d="M 280 85 L 185 250 L 258 250 L 225 390 L 335 235 L 264 235 Z"
    fill="#FFFFFF"
    opacity="0.8"
  />
</svg>
